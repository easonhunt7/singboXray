<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xray-go 智能一键部署</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --border: #d2d2d7;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            max-width: 880px;
            margin: 30px auto;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: var(--card-bg);
            padding: 28px 32px;
            border-radius: var(--radius);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        /* 顶部标题与Logo居中 */
        .header-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 22px;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .title-row img {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        h2 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        p.desc {
            color: var(--text-secondary);
            font-size: 13px;
            margin: 0;
            line-height: 1.4;
        }

        /* 协议双列网格容器 */
        .protocols-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
            align-items: start;
        }

        .protocol-section {
            background: #fafafc;
            border: 1px solid #e8e8ed;
            border-radius: 10px;
            padding: 14px 16px;
            transition: all 0.2s ease;
        }

        .protocol-section:hover {
            border-color: #c7c7cc;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-main);
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .sub-options {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e8e8ed;
            display: none;
        }

        .protocol-section.active .sub-options {
            display: block;
        }

        .compact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .proto-port-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            background: #ffffff;
            padding: 5px 8px;
            border-radius: 6px;
            border: 1px solid #e8e8ed;
        }

        .proto-port-box label {
            display: inline-flex;
            align-items: center;
            margin: 0;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
        }

        .proto-port-box input[type="checkbox"] {
            margin-right: 4px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .proto-port-box input[type="text"] {
            width: 100px;
            padding: 4px 6px;
            font-size: 11px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #fcfcfd;
        }

        .form-group {
            margin-bottom: 0;
        }

        label.field-label {
            display: block;
            margin-bottom: 3px;
            font-weight: 500;
            font-size: 11px;
            color: var(--text-secondary);
        }

        input[type="text"], select {
            width: 100%;
            padding: 6px 8px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            background: #fff;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.12);
        }

        .output-box {
            margin-top: 16px;
            border-top: 1px solid #e8e8ed;
            padding-top: 16px;
        }

        pre {
            background: #1d1d1f;
            color: #f5f5f7;
            padding: 12px 14px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace;
            font-size: 11px;
            line-height: 1.5;
            word-break: break-all;
            white-space: pre-wrap;
            margin-bottom: 14px;
        }

        /* 底部按钮与提示居中 */
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 9px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .toast {
            font-size: 12px;
            color: #34c759;
            font-weight: 500;
            height: 16px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 居中头部 -->
    <div class="header-center">
        <div class="title-row">
            <img src="logo.png" alt="Xray-go Logo">
            <h2>Xray-go 智能部署</h2>
        </div>
        <p class="desc">按需勾选下方协议模块，系统将为你实时生成定制化的 VPS 一键安装命令。</p>
    </div>
    
    <!-- 协议双列网格容器 -->
    <div class="protocols-grid">
        
        <!-- 1. NaiveProxy -->
        <div class="protocol-section" id-sec="naive">
            <label class="checkbox-label">
                <input type="checkbox" id="chkNaive" onchange="toggleSection('naive'); updateCommand();"> 1. NaiveProxy
            </label>
            <div class="sub-options">
                <label class="field-label" style="margin-bottom: 5px;">传输模式与端口 (留空 = 随机):</label>
                <div class="compact-grid">
                    <div class="proto-port-box">
                        <label><input type="checkbox" id="naiveH2" checked onchange="updateCommand()"> H2</label>
                        <input type="text" id="naiveH2Port" placeholder="留空随机" oninput="updateCommand()">
                    </div>
                    <div class="proto-port-box">
                        <label><input type="checkbox" id="naiveH3" checked onchange="updateCommand()"> H3</label>
                        <input type="text" id="naiveH3Port" placeholder="留空随机" oninput="updateCommand()">
                    </div>
                </div>
                <div class="compact-grid" style="margin-top: 6px;">
                    <div class="form-group">
                        <label class="field-label">绑定域名 (必填):</label>
                        <input type="text" id="naiveDomain" placeholder="naive.example.com" oninput="updateCommand()">
                    </div>
                    <div class="form-group">
                        <label class="field-label">API Token (必填):</label>
                        <input type="text" id="naiveApi" placeholder="CF API Token" oninput="updateCommand()">
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. xHTTP 直连 -->
        <div class="protocol-section" id-sec="xhttp">
            <label class="checkbox-label">
                <input type="checkbox" id="chkXhttp" onchange="toggleSection('xhttp'); updateCommand();"> 2. xHTTP 直连
            </label>
            <div class="sub-options">
                <label class="field-label" style="margin-bottom: 5px;">传输模式与端口 (留空 = 随机):</label>
                <div class="compact-grid">
                    <div class="proto-port-box">
                        <label><input type="checkbox" id="xhttpH2" checked onchange="updateCommand()"> H2</label>
                        <input type="text" id="xhttpH2Port" placeholder="留空随机" oninput="updateCommand()">
                    </div>
                    <div class="proto-port-box">
                        <label><input type="checkbox" id="xhttpH3" checked onchange="updateCommand()"> H3</label>
                        <input type="text" id="xhttpH3Port" placeholder="留空随机" oninput="updateCommand()">
                    </div>
                </div>
                <div class="compact-grid" style="margin-top: 6px;">
                    <div class="form-group">
                        <label class="field-label">域名 (可选，默认自签):</label>
                        <input type="text" id="xhttpDomain" placeholder="example.com" oninput="updateCommand()">
                    </div>
                    <div class="form-group">
                        <label class="field-label">API Token (可选):</label>
                        <input type="text" id="xhttpApi" placeholder="CF API Token" oninput="updateCommand()">
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. xHTTP-Argo -->
        <div class="protocol-section" id-sec="argo">
            <label class="checkbox-label">
                <input type="checkbox" id="chkArgo" onchange="toggleSection('argo'); updateCommand();"> 3. xHTTP-Argo
            </label>
            <div class="sub-options">
                <div class="compact-grid">
                    <div class="form-group">
                        <label class="field-label">Argo 协议:</label>
                        <select id="argoProtocol" onchange="updateCommand()">
                            <option value="http2" selected>http2</option>
                            <option value="quic">quic</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="field-label">本地端口:</label>
                        <input type="text" id="argoPort" value="8001" oninput="updateCommand()">
                    </div>
                </div>
                <div class="compact-grid" style="margin-top: 6px;">
                    <div class="form-group">
                        <label class="field-label">Argo 域名 (必填):</label>
                        <input type="text" id="argoDomain" placeholder="argo.example.com" oninput="updateCommand()">
                    </div>
                    <div class="form-group">
                        <label class="field-label">Argo Token (必填):</label>
                        <input type="text" id="argoToken" placeholder="Tunnel Token" oninput="updateCommand()">
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. VLESS-TCP-Reality -->
        <div class="protocol-section" id-sec="reality">
            <label class="checkbox-label">
                <input type="checkbox" id="chkReality" onchange="toggleSection('reality'); updateCommand();"> 4. VLESS-TCP-Reality
            </label>
            <div class="sub-options">
                <div class="form-group">
                    <label class="field-label">回落目标域名 (Dest):</label>
                    <input type="text" id="realityDest" value="microsoft.com" oninput="updateCommand()">
                </div>
            </div>
        </div>

    </div>

    <!-- 专属安装命令输出 -->
    <div class="output-box">
        <label style="font-size: 12px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; display: block;">专属安装命令 (复制并在您的 VPS 终端运行):</label>
        <pre id="cmdOutput">bash &lt;(curl -Ls https://raw.githubusercontent.com/easonhunt7/singboXray/main/install.sh)</pre>
        <div class="btn-container">
            <button class="btn" onclick="copyCommand()">📋 一键复制安装命令</button>
            <span id="copyToast" class="toast">已复制</span>
        </div>
    </div>
</div>

<script>
    function toggleSection(secName) {
        const chk = document.getElementById('chk' + capitalize(secName));
        const sec = document.querySelector(`[id-sec="${secName}"]`);
        if (chk.checked) {
            sec.classList.add('active');
            if (secName === 'naive') {
                document.getElementById('naiveH2').checked = true;
                document.getElementById('naiveH3').checked = true;
            } else if (secName === 'xhttp') {
                document.getElementById('xhttpH2').checked = true;
                document.getElementById('xhttpH3').checked = true;
            }
        } else {
            sec.classList.remove('active');
        }
    }

    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function updateCommand() {
        let cmd = "bash <(curl -Ls https://raw.githubusercontent.com/easonhunt7/singboXray/main/install.sh)";
        let params = [];

        // 1. NaiveProxy
        if (document.getElementById('chkNaive').checked) {
            let nh2 = document.getElementById('naiveH2').checked;
            let nh3 = document.getElementById('naiveH3').checked;
            let nh2Port = document.getElementById('naiveH2Port').value.trim();
            let nh3Port = document.getElementById('naiveH3Port').value.trim();
            let nDomain = document.getElementById('naiveDomain').value.trim();
            let nApi = document.getElementById('naiveApi').value.trim();
            
            let nParam = `--naive`;
            if (nh2) {
                nParam += ` --naive-h2=true`;
                if (nh2Port) nParam += ` --naive-h2-port="${nh2Port}"`;
            }
            if (nh3) {
                nParam += ` --naive-h3=true`;
                if (nh3Port) nParam += ` --naive-h3-port="${nh3Port}"`;
            }

            if (nDomain) nParam += ` --naive-domain="${nDomain}"`;
            if (nApi) nParam += ` --naive-api="${nApi}"`;
            params.push(nParam);
        }

        // 2. xHTTP 直连
        if (document.getElementById('chkXhttp').checked) {
            let xh2 = document.getElementById('xhttpH2').checked;
            let xh3 = document.getElementById('xhttpH3').checked;
            let xh2Port = document.getElementById('xhttpH2Port').value.trim();
            let xh3Port = document.getElementById('xhttpH3Port').value.trim();
            let xDomain = document.getElementById('xhttpDomain').value.trim();
            let xApi = document.getElementById('xhttpApi').value.trim();
            
            let xParam = `--xhttp`;
            if (xh2) {
                xParam += ` --xhttp-h2=true`;
                if (xh2Port) xParam += ` --xhttp-h2-port="${xh2Port}"`;
            }
            if (xh3) {
                xParam += ` --xhttp-h3=true`;
                if (xh3Port) xParam += ` --xhttp-h3-port="${xh3Port}"`;
            }

            if (xDomain) xParam +=
