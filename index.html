<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xray-go 快速一键部署</title>
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        :root {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --border: #d2d2d7;
            --radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
            max-width: 1140px;
            margin: 0 auto; /* 顶部顶格，左右居中 */
            padding: 0 24px 24px 24px; /* 顶部 padding 设为 0，直接贴顶 */
            background: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .container {
            background: var(--card-bg);
            padding: 28px 36px;
            border-radius: 0 0 var(--radius) var(--radius);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.02);
            border-top: none;
        }

        /* 标题居中，副标题靠左 */
        .header-box {
            margin-bottom: 22px;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .title-row img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        h2 {
            margin: 0;
            font-size: 23px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        p.desc {
            color: var(--text-secondary);
            font-size: 13.5px;
            margin: 0;
            line-height: 1.4;
            text-align: left;
        }

        /* 协议双列网格容器（宽松排列） */
        .protocols-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: 18px;
            margin-bottom: 22px;
            align-items: start;
        }

        .protocol-section {
            background: #fafafc;
            border: 1px solid #e8e8ed;
            border-radius: 10px;
            padding: 16px 18px;
            transition: all 0.2s ease;
        }

        .protocol-section:hover {
            border-color: #c7c7cc;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            color: var(--text-main);
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 17px;
            height: 17px;
            margin-right: 9px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .sub-options {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #e8e8ed;
            display: none;
        }

        .protocol-section.active .sub-options {
            display: block;
        }

        /* 卡片内部左右双栏：宽松排列 */
        .inner-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            align-items: start;
        }

        .stack-col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .proto-port-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #ffffff;
            padding: 7px 10px;
            border-radius: 7px;
            border: 1px solid #e8e8ed;
        }

        .proto-port-box label {
            display: inline-flex;
            align-items: center;
            margin: 0;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            white-space: nowrap;
        }

        .proto-port-box input[type="checkbox"] {
            margin-right: 6px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .proto-port-box input[type="text"] {
            width: 120px;
            padding: 5px 8px;
            font-size: 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
            background: #fcfcfd;
        }

        .form-group {
            margin-bottom: 0;
        }

        label.field-label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            font-size: 12px;
            color: var(--text-secondary);
        }

        input[type="text"], select {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: #fff;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.12);
        }

        .output-box {
            margin-top: 18px;
            border-top: 1px solid #e8e8ed;
            padding-top: 16px;
        }

        pre {
            background: #1d1d1f;
            color: #f5f5f7;
            padding: 14px 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace;
            font-size: 12px;
            line-height: 1.5;
            word-break: break-all;
            white-space: pre-wrap;
            margin-bottom: 16px;
        }

        /* 底部按钮居中，已复制提示在右侧 */
        .btn-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-wrapper {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 26px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        .toast {
            position: absolute;
            left: 100%;
            margin-left: 12px;
            white-space: nowrap;
            font-size: 13px;
            color: #34c759;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }

        @media (max-width: 700px) {
            .protocols-grid {
                grid-template-columns: 1fr;
            }
            .inner-split {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 头部：标题居中，提示语靠左 -->
    <div class="header-box">
        <div class="title-row">
            <img src="logo.png" alt="Xray-go Logo">
            <h2>Xray-go 快速一键部署</h2>
        </div>
        <p class="desc">按需勾选下方协议，生成一键安装命令。</p>
    </div>
    
    <!-- 协议双列网格容器 -->
    <div class="protocols-grid">
        
        <!-- 1. NaiveProxy -->
        <div class="protocol-section" data-sec="naive">
            <label class="checkbox-label">
                <input type="checkbox" id="chkNaive" class="proto-toggle"> 1. NaiveProxy
            </label>
            <div class="sub-options">
                <div class="inner-split">
                    <!-- 左侧：H2在上，H3在下 -->
                    <div class="stack-col">
                        <label class="field-label">传输模式与端口 (留空 = 随机):</label>
                        <div class="proto-port-box">
                            <label><input type="checkbox" id="naiveH2" checked> H2</label>
                            <input type="text" id="naiveH2Port" placeholder="端口 (留空随机)">
                        </div>
                        <div class="proto-port-box">
                            <label><input type="checkbox" id="naiveH3" checked> H3</label>
                            <input type="text" id="naiveH3Port" placeholder="端口 (留空随机)">
                        </div>
                    </div>
                    <!-- 右侧：绑定域名在上，API Token在下 -->
                    <div class="stack-col">
                        <div class="form-group">
                            <label class="field-label">绑定域名 (必填):</label>
                            <input type="text" id="naiveDomain" placeholder="naive.example.com">
                        </div>
                        <div class="form-group">
                            <label class="field-label">API Token (必填):</label>
                            <input type="text" id="naiveApi" placeholder="CF API Token">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. xHTTP 直连 -->
        <div class="protocol-section" data-sec="xhttp">
            <label class="checkbox-label">
                <input type="checkbox" id="chkXhttp" class="proto-toggle"> 2. xHTTP 直连
            </label>
            <div class="sub-options">
                <div class="inner-split">
                    <!-- 左侧：H2在上，H3在下 -->
                    <div class="stack-col">
                        <label class="field-label">传输模式与端口 (留空 = 随机):</label>
                        <div class="proto-port-box">
                            <label><input type="checkbox" id="xhttpH2" checked> H2</label>
                            <input type="text" id="xhttpH2Port" placeholder="端口 (留空随机)">
                        </div>
                        <div class="proto-port-box">
                            <label><input type="checkbox" id="xhttpH3" checked> H3</label>
                            <input type="text" id="xhttpH3Port" placeholder="端口 (留空随机)">
                        </div>
                    </div>
                    <!-- 右侧：域名在上，API Token在下 -->
                    <div class="stack-col">
                        <div class="form-group">
                            <label class="field-label">绑定域名 (可选，默认自签):</label>
                            <input type="text" id="xhttpDomain" placeholder="example.com">
                        </div>
                        <div class="form-group">
                            <label class="field-label">API Token (可选):</label>
                            <input type="text" id="xhttpApi" placeholder="CF API Token">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 3. xHTTP-Argo -->
        <div class="protocol-section" data-sec="argo">
            <label class="checkbox-label">
                <input type="checkbox" id="chkArgo" class="proto-toggle"> 3. xHTTP-Argo
            </label>
            <div class="sub-options">
                <div class="inner-split">
                    <!-- 左侧：Argo协议在上，端口在下 -->
                    <div class="stack-col">
                        <div class="form-group">
                            <label class="field-label">Argo 协议 (必填):</label>
                            <select id="argoProtocol">
                                <option value="http2" selected>http2</option>
                                <option value="quic">quic</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="field-label">本地监听端口 (必填):</label>
                            <input type="text" id="argoPort" value="8001">
                        </div>
                    </div>
                    <!-- 右侧：域名在上，Token在下 -->
                    <div class="stack-col">
                        <div class="form-group">
                            <label class="field-label">Argo 域名 (必填):</label>
                            <input type="text" id="argoDomain" placeholder="argo.example.com">
                        </div>
