<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>singboXray 一键部署命令生成器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background: #f4f6f8; color: #333; }
        .card { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #1a202c; }
        p { color: #4a5568; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 13px; color: #2d3748; }
        input { width: 100%; padding: 10px 12px; box-sizing: border-box; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15); }
        pre { background: #1a202c; color: #e2e8f0; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 12px; line-height: 1.6; word-break: break-all; white-space: pre-wrap; }
        .btn { background: #3182ce; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.2s; }
        .btn:hover { background: #2b6cb0; }
        .tip { font-size: 12px; color: #718096; margin-top: 5px; }
    </style>
</head>
<body>
<div class="card">
    <h2>🚀 singboXray 部署命令生成器</h2>
    <p>在下方填入你的 Cloudflare 域名与 API Token，系统将为你实时生成定制化的 VPS 一键安装命令。</p>
    
    <div class="form-group">
        <label>主根域名 (例如 example.com):</label>
        <input type="text" id="domain" placeholder="example.com" oninput="updateCommand()">
        <div class="tip">脚本将自动配置 h2.你的域名 和 h3.你的域名</div>
    </div>
    
    <div class="form-group">
        <label>Cloudflare API Token (需具备 DNS 编辑权限):</label>
        <input type="text" id="token" placeholder="填入你的 Cloudflare API Token" oninput="updateCommand()">
    </div>

    <div class="form-group">
        <label>专属安装命令 (复制并在你的 VPS 终端中运行):</label>
        <pre id="cmdOutput">DOMAIN="example.com" CF_TOKEN="你的Token" bash &lt;(curl -Ls https://raw.githubusercontent.com/easonhunt7/singboXray/main/install.sh)</pre>
        <br>
        <button class="btn" onclick="copyCommand()">📋 一键复制安装命令</button>
    </div>
</div>

<script>
    function updateCommand() {
        const domain = document.getElementById('domain').value.trim() || 'example.com';
        const token = document.getElementById('token').value.trim() || '你的Token';
        
        const fullCmd = `DOMAIN="${domain}" CF_TOKEN="${token}" bash <(curl -Ls https://raw.githubusercontent.com/easonhunt7/singboXray/main/install.sh)`;
        
        document.getElementById('cmdOutput').innerText = fullCmd;
    }

    function copyCommand() {
        const text = document.getElementById('cmdOutput').innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('命令已成功复制！请前往你的 VPS 终端粘贴运行。');
        });
    }
</script>
</body>
</html>
